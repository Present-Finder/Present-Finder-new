[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# /api/check, /api/scan, /api/ping, /api/places -> funcțiile de pe server
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# service worker-ul și manifestul nu se țin în cache, ca update-urile să ajungă imediat
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
